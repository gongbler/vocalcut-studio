# 자동 검사 (GitHub Actions): 코드를 올릴(push) 때마다, 또는 PR 을 만들 때마다
# GitHub 의 빈 컴퓨터(Linux)에서 처음부터 설치해 검사한다 → "내 PC 에서만 되는" 코드를 막는다.
#
# AI 패키지(torch, faster-whisper)는 설치하지 않는다. 테스트는 같은 통신 규칙을 쓰는 '가짜 실행기'로
# AI 부분을 검사하므로, 무거운 모델 없이 몇 분 안에 끝난다.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests (vitest)
        run: npm test
