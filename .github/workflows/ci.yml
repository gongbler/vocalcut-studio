# 자동 검사 (GitHub Actions): 코드를 올릴(push) 때마다, 또는 PR 을 만들 때마다
# GitHub 의 빈 컴퓨터(Linux)에서 처음부터 설치해 검사한다 → "내 PC 에서만 되는" 코드를 막는다.
#
# AI 패키지(torch, faster-whisper)는 설치하지 않는다. 테스트는 같은 통신 규칙을 쓰는 '가짜 실행기'로
# AI 부분을 검사하므로, 무거운 모델 없이 몇 분 안에 끝난다.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests (vitest)
        run: npm test

  docker:
    # Docker 상자를 실제로 만들고, 켜서, 사용자처럼 한 바퀴 써 본다 (AI 모델까지 상자 안에서 실행).
    # 무거우므로 테스트가 모두 통과한 뒤에만 돈다.
    name: Docker image (build + smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t vocalcut:ci .

      - name: Start container
        # CI 는 https 가 아니라서, https 전용 쿠키 설정(사이트 안에 넣기용)만 끈다
        run: |
          docker run -d --name vocalcut -p 7860:7860 -e VOCALCUT_COOKIE_CROSS_SITE=0 vocalcut:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:7860/api/health > /dev/null && exit 0
            sleep 2
          done
          docker logs vocalcut
          exit 1

      - name: Smoke test (upload, AI separation, AI subtitles, visitor isolation)
        run: python3 backend/tools/smoke_test.py http://localhost:7860

      - name: Image size
        if: always()
        run: docker image ls vocalcut:ci

      - name: Server log on failure
        if: failure()
        run: docker logs vocalcut

  deploy:
    # 모든 검사(+ Docker 안에서 실제 AI 점검)가 통과한 main 만 공개 데모 사이트에 올린다.
    # GitHub 저장소 Settings → Secrets → HF_TOKEN (Hugging Face 쓰기 토큰) 이 있어야 동작한다.
    name: Deploy to Hugging Face Space
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-space        # 배포가 겹치지 않게 한 번에 하나씩
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN 비밀값이 없어 배포를 건너뜁니다 (Settings → Secrets and variables → Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload and wait for the Space to restart
        if: steps.token.outputs.ok == 'true'
        run: |
          pip install huggingface_hub
          python deploy/huggingface/deploy.py --wait

      - name: Smoke test the live site
        if: steps.token.outputs.ok == 'true'
        run: python backend/tools/smoke_test.py https://gongbler-vocalcut-studio.hf.space
